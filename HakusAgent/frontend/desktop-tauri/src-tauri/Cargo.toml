[package]
name = "desktop-tauri"
version = "0.3.0"
description = "HakusAI Desktop Client"
authors = ["modemneko"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "unstable"] }
url = "2"
hakus-tui = { package = "hakus-tui", path = "../../../../frontend/terminal/crates/tui", version = "0.9.10" }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2.4.4"
tauri-plugin-updater = "2.11.0"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ssh2 = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
# Ensures a second app launch focuses the existing window instead of
# spawning a second process (which would show a duplicate tray icon).
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "windows")'.dependencies]
# DWM rounded corners for the undecorated main window (Windows 11).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[target.'cfg(target_os = "android")'.dependencies]
hakus-folder-picker = { path = "plugins/folder-picker" }
jni = "0.21"
