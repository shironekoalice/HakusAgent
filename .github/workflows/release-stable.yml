# 稳定版发布：手动触发，构建桌面端 + HakusCLI 全部产物、签名、生成
# latest.json 并发布到 GitHub。
#
# 与 build-all.yml 的区别：
#   - build-all 只发 `nightly` 预发布（用户手动下载，不参与自动更新）
#   - 本工作流发布固定 tag `stable`，是应用内「检查更新」读取的通道
#
# 产物范围与 nightly 对齐：桌面端（含品牌安装器）、HakusCLI 六平台、
# Android APK。nightly 有什么，stable 就发什么。
#
# 为什么用固定 tag 而不是 v* 版本 tag：客户端把
# `releases/download/stable/latest.json` 烘焙进二进制，固定 tag 让清单地址
# 长期稳定，不必每次发版都改客户端配置。
#
# 前置条件（仓库 Settings → Secrets and variables → Actions）：
#   TAURI_SIGNING_PRIVATE_KEY           更新签名私钥（必需，缺失则无法产出 .sig）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  私钥密码（生成时未设密码则留空）
#
# 触发：Actions → release-stable → Run workflow，输入要发布的版本号。

name: release-stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号（须与 tauri.conf.json 的 version 一致，例如 0.3.0）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-stable
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  STABLE_TAG: stable

jobs:
  desktop:
    name: desktop-${{ matrix.artifact }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact: windows
            args: ""
          - platform: macos-latest
            artifact: macos-arm64
            args: "--target aarch64-apple-darwin"
          - platform: macos-14
            artifact: macos-x64
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            artifact: linux
            args: ""
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-14' && 'x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Verify every version declaration matches
        shell: bash
        run: |
          # Four files declare a version and all of them feed user-visible
          # output: the app's updater comparison, the NSIS installer's bundle
          # name, and the branded installer's Add/Remove Programs entry. A
          # partial bump ships a release whose parts disagree about what
          # version it is, so every source is checked up front.
          expected="${{ inputs.version }}"
          fail=0
          check() {
            local label="$1" actual="$2"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$label is '$actual' but the workflow was given '$expected'"
              fail=1
            else
              echo "ok: $label = $actual"
            fi
          }
          check "desktop-tauri/tauri.conf.json" \
            "$(node -p "require('./HakusAgent/frontend/desktop-tauri/src-tauri/tauri.conf.json').version")"
          check "desktop-tauri/Cargo.toml" \
            "$(grep -m1 '^version' HakusAgent/frontend/desktop-tauri/src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          check "installer/tauri.conf.json" \
            "$(node -p "require('./HakusAgent/frontend/installer/src-tauri/tauri.conf.json').version")"
          check "installer/Cargo.toml" \
            "$(grep -m1 '^version' HakusAgent/frontend/installer/src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          exit $fail

      - name: Install frontend dependencies
        working-directory: HakusAgent/frontend/desktop-tauri
        run: npm ci

      - name: Verify signing secret is configured
        # shell: bash is required — without it the Windows runner falls back to
        # PowerShell, where the bash test below is not evaluated and the guard
        # misfires (it reported "not set" for a secret that was present).
        shell: bash
        # Fail here rather than after a 15-minute build: a missing key does not
        # error at build time (the bundler just skips signing), so the only
        # symptom would be absent .sig files discovered much later.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Add it under Settings / Secrets and variables / Actions. Without it the updater artifacts cannot be signed and no update can ever be installed."
            exit 1
          fi
          echo "signing key present (${#TAURI_SIGNING_PRIVATE_KEY} chars)"

      - name: Build Tauri app (signed)
        working-directory: HakusAgent/frontend/desktop-tauri
        # createUpdaterArtifacts is enabled in tauri.conf.json, so the bundler
        # emits the updater bundle plus its .sig sidecar.
        #
        # TAURI_SIGNING_PRIVATE_KEY_PASSWORD must be set even when the key has
        # no password. Verified locally: with the variable simply absent, the
        # bundler logs "Decrypting updater signing key, expect a prompt for
        # password", skips signing WITHOUT failing, and produces no .sig — the
        # build looks green and the breakage only surfaces at publish time.
        # An explicitly empty string makes it sign with an empty password.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build ${{ matrix.args }}

      - name: Collect updater artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stable-assets
          base="HakusAgent/frontend/desktop-tauri/src-tauri/target"
          # Updater bundles live under the target triple's bundle dir on
          # cross-compiled macOS builds, so search the whole tree.
          find "$base" -type f \( \
            -name '*.sig' -o \
            -name '*-setup.exe' -o \
            -name '*.app.tar.gz' -o \
            -name '*.AppImage' \
          \) -exec cp -v {} stable-assets/ \;
          # Tauri emits the same macOS filenames for both architectures. The
          # publish job merges all artifacts into one directory, so preserve
          # both bundles with architecture-specific names before uploading.
          case "${{ matrix.artifact }}" in
            macos-arm64) mac_suffix="arm64" ;;
            macos-x64) mac_suffix="x64" ;;
            *) mac_suffix="" ;;
          esac
          if [ -n "$mac_suffix" ]; then
            for bundle in stable-assets/*.app.tar.gz; do
              [ -e "$bundle" ] || continue
              renamed="${bundle%.app.tar.gz}_${mac_suffix}.app.tar.gz"
              mv "$bundle" "$renamed"
              if [ -f "${bundle}.sig" ]; then
                mv "${bundle}.sig" "${renamed}.sig"
              fi
            done
          fi
          echo "--- collected ---"
          ls -la stable-assets/
          if ! ls stable-assets/*.sig >/dev/null 2>&1; then
            echo "::error::No .sig files produced. Set TAURI_SIGNING_PRIVATE_KEY and make sure bundle.createUpdaterArtifacts is true."
            exit 1
          fi
          # Drop signatures whose bundle was not collected (.deb/.rpm/.msi are
          # signed by the bundler but are not self-updating, so the updater
          # never reads them). Uploading them wastes mirror bandwidth and makes
          # it look like a platform shipped when only its signature did.
          for sig in stable-assets/*.sig; do
            bundle="$(basename "$sig" .sig)"
            if [ ! -f "stable-assets/$bundle" ]; then
              echo "dropping orphan signature: $bundle.sig (no matching bundle)"
              rm -f "$sig"
            fi
          done
          echo "--- after pruning orphans ---"
          ls -la stable-assets/

      - uses: actions/upload-artifact@v4
        with:
          name: stable-${{ matrix.artifact }}
          path: stable-assets/*
          if-no-files-found: error

  # HakusCLI — 与 nightly 的 hakuscli job 同一套矩阵与构建命令，保证
  # stable 的产物和 nightly 一一对应。额外的 `hakus-*` 副本是为 CLI 自更新
  # 准备的：它按 `hakus-{os}-{arch}` 约定查找资源（cli/src/update.rs），
  # 只看正式 release，因此只在 stable 通道发布时才有意义。
  hakuscli:
    name: cli-${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            cross: false
          - asset: linux-arm64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            cross: true
          - asset: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            cross: false
          - asset: macos-x64
            os: macos-14
            target: x86_64-apple-darwin
            cross: true
          - asset: windows-x64.exe
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
          - asset: windows-arm64.exe
            os: windows-latest
            target: aarch64-pc-windows-msvc
            cross: true
          - asset: android-arm64.tar.gz
            os: ubuntu-22.04
            target: aarch64-linux-android
            android: true
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: nttld/setup-ndk@v1
        if: matrix.android
        with:
          ndk-version: r26d

      - name: Install cargo-ndk
        if: matrix.android
        run: cargo install cargo-ndk --locked

      - name: Install system deps (linux native)
        if: matrix.os == 'ubuntu-22.04' && matrix.cross == false && matrix.android != true
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build (Android Bionic)
        if: matrix.android
        working-directory: frontend/terminal
        run: |
          cargo ndk --platform 26 -t arm64-v8a build --release --bin hakuscli
          tar czf hakuscli-android-arm64.tar.gz \
            -C target/aarch64-linux-android/release hakuscli

      - name: Install cross
        if: matrix.cross == true && matrix.android != true
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.cross == true && matrix.android != true
        working-directory: frontend/terminal
        run: cross build --release --locked --target ${{ matrix.target }} --bin hakuscli

      - name: Build (native)
        if: matrix.cross == false && matrix.android != true
        working-directory: frontend/terminal
        run: cargo build --release --locked --target ${{ matrix.target }} --bin hakuscli

      - name: Package (unix)
        if: matrix.os != 'windows-latest' && matrix.android != true
        working-directory: frontend/terminal
        run: |
          cp "target/${{ matrix.target }}/release/hakuscli" "hakuscli-${{ matrix.asset }}"
          chmod +x "hakuscli-${{ matrix.asset }}"

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        working-directory: frontend/terminal
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/hakuscli.exe" -Destination "hakuscli-${{ matrix.asset }}"

      # CLI 自更新按 `hakus-*` 命名查找，所以除 hakuscli-* 之外再放一份
      # 同内容的 `hakus-*`。桌面端产物不参与这一步。
      - name: Publish asset under the self-update name
        if: matrix.android != true
        shell: bash
        working-directory: frontend/terminal
        run: |
          set -euo pipefail
          src="hakuscli-${{ matrix.asset }}"
          dst="hakus-${{ matrix.asset }}"
          cp "$src" "$dst"
          echo "self-update asset: $dst"

      - name: Collect CLI assets
        shell: bash
        working-directory: frontend/terminal
        run: |
          set -euo pipefail
          mkdir -p cli-assets
          find . -maxdepth 1 -type f \( -name 'hakuscli-*' -o -name 'hakus-*' \) -exec cp -v {} cli-assets/ \;
          ls -la cli-assets/

      - uses: actions/upload-artifact@v4
        with:
          name: stable-cli-${{ matrix.asset }}
          path: frontend/terminal/cli-assets/*
          if-no-files-found: error

  # 与 build-all.yml 的 android job 同源（nightly run 53 全绿验证过）：
  # Java 17、Android SDK、NDK r27c、tauri android init、品牌图标与清单
  # 补丁、BINDGEN sysroot、签名。其中 BINDGEN_EXTRA_CLANG_ARGS 是关键：
  # 缺了它 rquickjs-sys 会拿宿主 /usr/include 生成绑定，报
  # 'bits/libc-header-start.h' file not found 并让 publish 整个被跳过。
  android:
    name: android-apk
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # 默认 'tools platform-tools' 里的 legacy `tools` 包在
          # cmdline-tools 16.0 已被移除，sdkmanager 会直接 exit 1
          # （nightly #54/#55 同因失败）。所需包由下一步显式安装。
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: HakusAgent/frontend/desktop-tauri
        run: npm ci

      - name: Initialize Android project
        working-directory: HakusAgent/frontend/desktop-tauri
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: npx tauri android init --ci --skip-targets-install

      - name: Apply branded Android icons
        working-directory: HakusAgent/frontend/desktop-tauri
        shell: bash
        run: |
          set -euo pipefail
          source_icons="src-tauri/icons/android"
          generated_resources="src-tauri/gen/android/app/src/main/res"
          test -f "$source_icons/mipmap-hdpi/ic_launcher.png"
          test -d "$generated_resources"
          cp -R "$source_icons/." "$generated_resources/"

      - name: Permit LAN HTTP HakusAI servers
        working-directory: HakusAgent/frontend/desktop-tauri
        shell: bash
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("src-tauri/gen/android/app/src/main/AndroidManifest.xml")
          m = p.read_text(encoding="utf-8")
          if 'android:usesCleartextTraffic' in m:
              m = re.sub(r'android:usesCleartextTraffic="[^"]*"', 'android:usesCleartextTraffic="true"', m)
          else:
              m = m.replace('<application', '<application\n        android:usesCleartextTraffic="true"', 1)
          if 'android.permission.INTERNET' not in m:
              m = re.sub(r'(<application\b[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.INTERNET" />', m, count=1)
          if 'android:allowBackup' in m:
              m = re.sub(r'android:allowBackup="[^"]*"', 'android:allowBackup="false"', m)
          else:
              m = m.replace('<application', '<application\n        android:allowBackup="false"', 1)
          p.write_text(m, encoding="utf-8")
          print("manifest patched")
          PY
          grep -q 'android:usesCleartextTraffic="true"' src-tauri/gen/android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' src-tauri/gen/android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' src-tauri/gen/android/app/src/main/AndroidManifest.xml

      - name: Build Android APK
        working-directory: HakusAgent/frontend/desktop-tauri
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android: >-
            --sysroot=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
            --target=aarch64-linux-android26
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_android: >-
            --sysroot=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
            --target=aarch64-linux-android26
        run: npx tauri android build --ci --apk --split-per-abi --target aarch64

      - name: Prepare Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/hakusai-release.keystore"

          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required when using a release keystore}"
            : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS is required when using a release keystore}"
            : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required when using a release keystore}"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            signing_password="$ANDROID_KEYSTORE_PASSWORD"
            key_alias="$ANDROID_KEY_ALIAS"
            key_password="$ANDROID_KEY_PASSWORD"
          else
            echo "::warning::Android signing secrets are not configured; using a temporary CI signing key."
            key_alias="hakusai-ci"
            signing_password="android"
            key_password="android"
            keytool -genkeypair -v \
              -keystore "$keystore" \
              -storepass "$signing_password" \
              -alias "$key_alias" \
              -keypass "$key_password" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=HakusAI CI, OU=Android, O=HakusAI, C=CN"
          fi

          {
            echo "ANDROID_KEYSTORE_PATH=$keystore"
            echo "ANDROID_SIGNING_PASSWORD=$signing_password"
            echo "ANDROID_KEY_ALIAS=$key_alias"
            echo "ANDROID_KEY_PASSWORD=$key_password"
          } >> "$GITHUB_ENV"

      - name: Align and sign Android APK
        working-directory: HakusAgent/frontend/desktop-tauri
        shell: bash
        run: |
          set -euo pipefail
          apk_root="src-tauri/gen/android/app/build/outputs/apk"
          signed_dir="$apk_root/signed"
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p "$signed_dir"

          mapfile -t unsigned_apks < <(find "$apk_root" -type f -name '*-unsigned.apk' -print)
          if [[ "${#unsigned_apks[@]}" -eq 0 ]]; then
            echo "No unsigned release APK was produced under $apk_root"
            find "$apk_root" -type f -name '*.apk' -print || true
            exit 1
          fi

          for unsigned_apk in "${unsigned_apks[@]}"; do
            filename="$(basename "$unsigned_apk")"
            base="${filename%-unsigned.apk}"
            aligned_apk="$RUNNER_TEMP/${base}-aligned.apk"
            signed_apk="$signed_dir/${base}-signed.apk"

            "$build_tools/zipalign" -f -p 4 "$unsigned_apk" "$aligned_apk"
            "$build_tools/apksigner" sign \
              --ks "$ANDROID_KEYSTORE_PATH" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass "pass:$ANDROID_SIGNING_PASSWORD" \
              --key-pass "pass:$ANDROID_KEY_PASSWORD" \
              --out "$signed_apk" "$aligned_apk"
            "$build_tools/apksigner" verify --verbose "$signed_apk"
          done

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-assets
          find HakusAgent/frontend/desktop-tauri/src-tauri/gen/android/app/build/outputs/apk/signed -name '*-signed.apk' -print0 |
            while IFS= read -r -d '' f; do
              cp "$f" "apk-assets/HakusAI_${{ inputs.version }}_android-arm64.apk"
            done
          ls -la apk-assets/

      - uses: actions/upload-artifact@v4
        with:
          name: stable-android-apk
          path: apk-assets/*
          if-no-files-found: error

  publish:
    name: publish-stable
    needs: [desktop, hakuscli, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: _stable
          merge-multiple: true

      - name: Flatten artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stable-assets
          find _stable -type f -exec cp -v {} stable-assets/ \;
          ls -la stable-assets/

      - name: Generate latest.json
        run: |
          node scripts/generate-latest-json.mjs \
            --version "${{ inputs.version }}" \
            --assets-dir stable-assets \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${STABLE_TAG}" \
            --out latest.json

      - name: Remove old stable assets
        uses: actions/github-script@v7
        with:
          script: |
            let release
            try {
              release = (await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.STABLE_TAG,
              })).data
            } catch (error) {
              if (error.status === 404) {
                core.info('No existing stable release; the publish step will create it.')
                return
              }
              throw error
            }
            for (const asset of release.assets) {
              core.info(`Removing ${asset.name}`)
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
              })
            }

      - name: Publish GitHub stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.STABLE_TAG }}
          name: HakusAI Stable
          # Keep the tag name fixed so the client's baked-in endpoint remains
          # valid; the ref is refreshed after the assets upload succeeds.
          prerelease: false
          make_latest: true
          body: |
            HakusAI v${{ inputs.version }} stable build.

            Built from commit `${{ github.sha }}`.
          files: |
            stable-assets/*
            latest.json

      - name: Refresh stable release metadata
        uses: actions/github-script@v7
        with:
          script: |
            const ref = 'tags/${{ env.STABLE_TAG }}'
            try {
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
                sha: context.sha,
                force: true,
              })
            } catch (error) {
              if (error.status !== 404) throw error
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/${ref}`,
                sha: context.sha,
              })
            }

            const release = (await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: process.env.STABLE_TAG,
            })).data
            if (release.draft || release.prerelease) {
              throw new Error('The stable release is not published as a regular release.')
            }
            if (!release.assets.some(asset => asset.name === 'latest.json')) {
              throw new Error('The stable release is missing latest.json.')
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              target_commitish: context.sha,
            })

            const refreshed = (await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
            })).data
            if (refreshed.object.sha !== context.sha) {
              throw new Error(`Stable tag points to ${refreshed.object.sha}, expected ${context.sha}.`)
            }
            core.info(`Verified stable tag at ${context.sha} with ${release.assets.length} release assets.`)
